<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talking Tom</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🐱 Talking Tom 🐱</h1>
            <div class="status-bar">
                <div class="hunger">
                    <span>🍎</span>
                    <div class="bar">
                        <div class="fill" id="hunger-fill"></div>
                    </div>
                </div>
                <div class="happiness">
                    <span>😊</span>
                    <div class="bar">
                        <div class="fill" id="happiness-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tom-container">
            <div class="speech-bubble" id="speech-bubble">
                <p id="speech-text">Hi! I'm Tom! Talk to me!</p>
            </div>
            
            <div class="tom-character" id="tom">
                <img src="tom.png" alt="Tom the Cat" id="tom-image">
                <div class="eyes" id="eyes">
                    <div class="eye left-eye"></div>
                    <div class="eye right-eye"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" id="talk-btn">🎤 Talk</button>
            <button class="control-btn" id="feed-btn">🍎 Feed</button>
            <button class="control-btn" id="pet-btn">👋 Pet</button>
            <button class="control-btn" id="poke-btn">👆 Poke</button>
        </div>

        <div class="voice-controls">
            <button id="start-recording" class="record-btn">🎤 Start Recording</button>
            <button id="stop-recording" class="record-btn" disabled>⏹️ Stop Recording</button>
            <div class="recording-status" id="recording-status"></div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
